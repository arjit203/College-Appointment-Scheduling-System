<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Dashboard – CampusConnect</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,"> <!-- no favicon yet: stops the browser asking for /favicon.ico -->
</head>
<!-- auth-pending hides the page until dashboard.js confirms a Student is logged in -->
<body class="auth-pending" data-required-role="Student">
    <nav class="navbar navbar-dark navbar-cc px-3">
        <a class="navbar-brand" href="student-dashboard.html">CampusConnect</a>
        <div class="d-flex align-items-center gap-3 text-white">
            <span class="d-none d-sm-inline small">
                <span id="navUserName"></span>
                <span id="navUserRole" class="badge text-bg-light ms-1"></span>
            </span>
            <button id="logoutButton" class="btn btn-outline-light btn-sm">Log out</button>
        </div>
    </nav>

    <main class="container my-4">
        <div class="page-header">
            <h1 class="h3 mb-1">Welcome, <span id="welcomeName"></span></h1>
            <p class="text-muted mb-0">Student dashboard</p>
        </div>

        <div id="pageAlert" class="mb-3"></div>

        <div class="row g-4">
            <div class="col-md-6">
                <div id="profileBox" class="card info-card shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 mb-0">My account</h2>
                            <span id="profileStatus" class="badge text-bg-secondary">Checking...</span>
                        </div>
                        <dl class="row mb-0">
                            <dt class="col-4">Name</dt><dd class="col-8" id="profileName">–</dd>
                            <dt class="col-4">Email</dt><dd class="col-8" id="profileEmail">–</dd>
                            <dt class="col-4">Role</dt><dd class="col-8" id="profileRoles">–</dd>
                        </dl>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card info-card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Coming soon</h2>
                        <ul class="list-unstyled coming-soon mb-0">
                            <li>Browse faculty members</li>
                            <li>View available time slots</li>
                            <li>Book appointments</li>
                            <li>View and cancel my appointments</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
